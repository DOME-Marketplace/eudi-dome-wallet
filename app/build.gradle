plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'

    id 'project-report'  // used with command:  ./gradlew htmlDependencyReport
}

// need to project report
htmlDependencyReport {
    projects = project.allprojects
}

android {
    signingConfigs {
        release {
            storeFile file('../sign/eudi_dome_wallet.jks')
            storePassword 'EudiDomeKeystoreWallet2025'
            keyAlias 'eudi-dome-wallet-key'
            keyPassword 'EudiDomeKeystoreWallet2025'
        }
    }

    compileSdk 35 // Android 15

    buildFeatures {
        dataBinding true
        viewBinding true
        buildConfig true
    }

    defaultConfig {
        applicationId "com.inetum.eudi_dome_wallet"
        minSdkVersion 28 // Android 9.0
        targetSdkVersion 35 // Android 15
        versionCode 1 //25 = 1.3.6
        versionName "1.0.0"

        buildConfigField "String", 'WALLET_IDENTIFIER', '"EUDI DOME Wallet"';

        buildConfigField "boolean", "JWT_VERIFICATION_ENABLED", "true";
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            buildConfigField "boolean", 'SHORTCUTS_ENABLED', "false"
            buildConfigField "boolean", 'DEBUG_AFK_TIMER_LOG', "false"
            buildConfigField "boolean", 'USE_AFK_TIMER', "true"
            buildConfigField "boolean", 'USE_LIBRARY_WAITING_POPUP', "false"
            buildConfigField "boolean", 'ANTI_ROOTKIT_CHECK_ENABLED', "true"
            //PARA PODER SALTAR LOGIN Y AUTORELLENAR LOS USERS Y PASS. DESHABILITAR EN PROD
            buildConfigField "boolean", 'TEMPORARY_DEVELOPMENT_SHORTCUT', "false"
            buildConfigField "boolean", 'SHORTCUT_DEVELOPMENT_BUTTON', "false"
            buildConfigField "String", "DEFAULT_LANGUAGE", '"ES"'
            buildConfigField "boolean", 'ENABLE_TEST_DATA_POPULATION', "false"
            debuggable false
            signingConfig signingConfigs.debug//!\\ WARNING - HABILITAR SOLO PARA PRUEBAS //!\\
            //signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
            buildConfigField "boolean", 'SHORTCUTS_ENABLED', "true"
            buildConfigField "boolean", 'DEBUG_AFK_TIMER_LOG', "false"
            buildConfigField "boolean", 'USE_AFK_TIMER', "false"
            buildConfigField "boolean", 'USE_LIBRARY_WAITING_POPUP', "false"
            buildConfigField "boolean", 'ANTI_ROOTKIT_CHECK_ENABLED', "false"
            //PARA PODER SALTAR LOGIN Y AUTORELLENAR LOS USERS Y PASS. DESHABILITAR EN PROD
            buildConfigField "boolean", 'TEMPORARY_DEVELOPMENT_SHORTCUT', "true"
            buildConfigField "boolean", 'SHORTCUT_DEVELOPMENT_BUTTON', "false"
            buildConfigField "String", "DEFAULT_LANGUAGE", '"ES"'
            buildConfigField "boolean", 'ENABLE_TEST_DATA_POPULATION', "true"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    namespace 'com.inetum.eudi_dome_wallet'

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
    packagingOptions {
        exclude 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/DISCLAIMER'
    }
}

dependencies {

    implementation(project(path: ':utils'))
    // Test
    implementation 'androidx.test:core-ktx:1.6.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.8'
    implementation 'com.google.firebase:firebase-dataconnect:16.0.2'
    testImplementation 'junit:junit:4.13.2'

    def mockito_version = "5.14.2"
    testImplementation("org.mockito:mockito-core:$mockito_version")
    testImplementation("org.mockito:mockito-android:$mockito_version")
    testImplementation 'androidx.test:runner:1.6.2'
    // Test User Interface
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    implementation 'androidx.databinding:databinding-runtime:8.10.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1"
    // Jetpack ViewModel
    def lifecycle_version = "2.9.1"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    // Jetpack Navigation implementation
    def nav_version = "2.9.0"
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"

    // Jetpack Navigation Feature module Support
    implementation "androidx.navigation:navigation-dynamic-features-fragment:$nav_version"
    // Jetpack Navigation Testing Navigation
    androidTestImplementation "androidx.navigation:navigation-testing:$nav_version"
    // Jetpack Navigation Jetpack Compose Integration
    implementation "androidx.navigation:navigation-compose:2.9.0"
    implementation "androidx.security:security-crypto:1.1.0-alpha07"
    implementation 'androidx.biometric:biometric:1.2.0-alpha05'
    implementation "com.google.code.gson:gson:2.12.1"

    // For local Data Base
    def room_version = "2.7.1"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"
    kapt "androidx.room:room-compiler:$room_version"
    implementation 'net.zetetic:android-database-sqlcipher:4.5.4'

    implementation 'com.journeyapps:zxing-android-embedded:4.3.0' // deprecado sustituir
    //SweetAlert (POPUPS)
    implementation 'com.github.f0ris.sweetalert:library:1.6.2'
    //root kit
    implementation 'com.scottyab:rootbeer-lib:0.1.0'
    //QR Generator
    implementation 'com.github.kenglxn.QRGen:android:2.6.0'
    //Zoom Controls
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
    //JSON Viewer
    implementation 'com.github.pvarry:android-json-viewer:v1.1'
    //ZIP
    implementation 'net.lingala.zip4j:zip4j:2.6.1'

    implementation 'org.bouncycastle:bcprov-jdk18on:1.80'
    def web3jVersion = "4.12.0"
    implementation("org.web3j:core:$web3jVersion")  {
        exclude group: "org.codehaus.groovy"
        exclude group: "org.identityconnectors"
        exclude group: "org.apache.ivy"
    }

    implementation("com.github.multiformats:java-multibase:1.0.0")
    implementation("com.nimbusds:nimbus-jose-jwt:10.0.1")
    implementation("androidx.javascriptengine:javascriptengine:1.0.0-rc01")
}